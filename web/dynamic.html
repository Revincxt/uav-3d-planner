<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=flight-mark-1" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=flight-mark-1" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore recorded dynamic UAV replanning scenarios." />
    <title>Manhattan replanning — UAV 3D Planner</title>
  </head>
  <body>
    <main class="workspace workspace-dynamic">
      <header class="app-header">
        <nav class="study-nav" aria-label="Planning views">
          <a href="./">Static</a>
          <a href="./dynamic.html" aria-current="page">Dynamic</a>
          <a href="./predictive.html">Predictive</a>
          <a href="./results.html">Benchmark</a>
        </nav>
      </header>

      <div class="workspace-body">
        <select id="scenario-select" aria-label="Route details" hidden></select>

        <section class="workspace-content" aria-label="Dynamic replay workspace">
          <p id="load-state" class="load-state" role="status" aria-live="polite">Loading dynamic scenes…</p>
          <div class="demo-grid dynamic-demo-grid">
            <section class="stage-card dynamic-stage" aria-label="Dynamic scene and camera controls">
              <header class="stage-toolbar" role="group" aria-label="Flight controls">
                <label class="planner-control"><span class="sr-only">Planner</span><select id="planner-select" aria-label="Planner"></select></label>
                <div class="follow-controls"><select id="follow-target" aria-label="Drone to follow"></select><button id="follow-toggle" type="button" aria-pressed="false" title="Close chase view centered on the selected UAV">Follow</button></div>
                <div class="view-controls camera-controls" role="group" aria-label="Camera view">
                  <button type="button" data-view="isometric" aria-pressed="true">3D</button>
                  <button type="button" data-view="top" aria-pressed="false">Top</button>
                  <button type="button" data-view="reset" title="Reset camera" aria-label="Reset camera"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.2 7A6 6 0 1 1 4 12M4.2 7V3.7M4.2 7h3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
                </div>
              </header>
              <div class="stage-viewport dynamic-viewport">
                <div id="dynamic-viewer" class="dynamic-viewer" role="img" aria-label="Three-dimensional dynamic replanning scene"></div>
                <div id="playback-state" class="playback-state">Live replanning · Ready</div>
                <div class="scene-legend" aria-label="Route legend"></div>
                <div class="map-attribution">Imagery: USDA · <a href="https://www.usgs.gov/the-national-map-data-delivery" target="_blank" rel="noopener noreferrer">USGS The National Map</a></div>
              </div>
              <div class="playback-bar" aria-label="Playback controls">
                <div class="button-group transport-buttons">
                  <button id="previous-frame" type="button" aria-label="Previous frame">‹</button>
                  <button id="play-pause" class="primary-button" type="button" aria-pressed="false" aria-label="Play" title="Play"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="play-symbol" d="M7 4.5 16 10l-9 5.5Z" fill="currentColor" /><path class="pause-symbol" d="M6 5h3v10H6zm5 0h3v10h-3z" fill="currentColor" /></svg></button>
                  <button id="next-frame" type="button" aria-label="Next frame">›</button>
                </div>
                <label class="timeline-control" for="timeline"><span><output id="timeline-value" for="timeline">0.0 s</output></span><input id="timeline" type="range" min="0" max="0" step="any" value="0" aria-label="Shared timeline for eight missions" /></label>
                <div class="speed-control" aria-label="Playback speed"><button type="button" data-speed="0.5" aria-pressed="false">0.5×</button><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2" aria-pressed="false">2×</button></div>
              </div>
            </section>

            <aside class="inspector-card dynamic-inspector" aria-label="Replay metrics">
              <div class="inspector-heading"><p class="eyebrow">Telemetry</p><h2>Flight monitor</h2><p id="frame-summary" class="muted">Frame 1</p></div>
              <div class="inspector-tabs" role="tablist" aria-label="Metric view" data-tab-group>
                <button type="button" id="live-tab" role="tab" aria-selected="true" aria-controls="live-panel" data-panel="live-panel">Live state</button>
                <button type="button" id="outcome-tab" role="tab" aria-selected="false" aria-controls="outcome-panel" data-panel="outcome-panel">Outcome</button>
              </div>
              <section id="live-panel" class="dynamic-metric-panel" role="tabpanel" aria-labelledby="live-tab">
                <div id="frame-metrics-body" class="metric-grid"></div>
                <div class="position-readout"><span class="muted">Vehicle · ENU metres</span><strong id="vehicle-position">—</strong></div>
              </section>
              <section id="outcome-panel" class="dynamic-metric-panel" role="tabpanel" aria-labelledby="outcome-tab" hidden>
                <p id="run-status" class="run-status"></p>
                <div id="outcome-metrics-body" class="metric-grid"></div>
              </section>
              <div class="comparison-heading"><p class="eyebrow">Planners</p></div>
              <div id="comparison-body" class="planner-comparison"></div>
            </aside>
          </div>
          <p id="live-region" class="sr-only" aria-live="polite"></p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/dynamic.ts"></script>
  </body>
</html>
