<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore recorded UAV trajectories through urban airspace and time-dependent hazards." />
    <title>Manhattan airspace · UAV 3D Planner</title>
  </head>
  <body>
    <main class="workspace workspace-predictive">
      <header class="app-header">
        <nav class="study-nav" aria-label="Planning views">
          <a href="./">Static</a><a href="./dynamic.html">Dynamic</a>
          <a href="./predictive.html" aria-current="page">Predictive</a><a href="./results.html">Benchmark</a>
        </nav>
      </header>
      <div class="workspace-body">
        <select id="scenario-select" aria-label="Route details" hidden></select>
        <section class="workspace-content">
          <header class="content-heading">
            <div><h1 id="scene-title">Manhattan</h1><p id="case-geometry" hidden></p></div>
          </header>
          <div class="demo-grid">
            <section class="stage-card" aria-label="Trajectory replay">
              <div class="stage-toolbar" role="group" aria-label="Flight controls">
                <label class="planner-control"><span class="sr-only">Planner</span><select id="planner-select" aria-label="Planner"></select></label>
                <div class="follow-controls"><select id="follow-target" aria-label="Drone to follow"></select><button id="follow-toggle" type="button" aria-pressed="false" title="Close chase view centered on the selected UAV">Follow</button></div>
                <div class="view-controls camera-controls" role="group" aria-label="Camera projection">
                  <button type="button" data-view="isometric" aria-pressed="true">3D</button>
                  <button type="button" data-view="xy" aria-pressed="false">Top</button>
                </div>
              </div>
              <div class="stage-viewport">
                <div id="predictive-viewer" role="img" aria-label="Three-dimensional predictive planning replay"></div>
                <div id="playback-state" class="playback-state">Space-time · Ready</div>
                <div class="viewer-time" hidden><strong id="viewer-time-value">0.0 s</strong></div>
                <div id="viewer-witness-readout" class="viewer-witness-readout" hidden><span>Closest approach</span><strong id="viewer-witness-value">—</strong><small id="viewer-witness-detail">—</small></div>
                <div class="canvas-legend" aria-label="Route legend"></div>
                <p id="canvas-summary" class="sr-only"></p>
                <div class="map-attribution">Imagery: USDA · <a href="https://www.usgs.gov/the-national-map-data-delivery" target="_blank" rel="noopener noreferrer">USGS The National Map</a></div>
              </div>
              <div class="playback-bar" aria-label="Playback controls">
                <div class="button-group">
                  <button id="previous-frame" type="button" aria-label="Previous recorded event" title="Previous event">‹</button>
                  <button id="play-pause" type="button" aria-pressed="false" aria-label="Play" title="Play"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="play-symbol" d="M7 4.5 16 10l-9 5.5Z" fill="currentColor" /><path class="pause-symbol" d="M6 5h3v10H6zm5 0h3v10h-3z" fill="currentColor" /></svg></button>
                  <button id="next-frame" type="button" aria-label="Next recorded event" title="Next event">›</button>
                </div>
                <label class="timeline-control" for="timeline"><span><output id="timeline-value" for="timeline">0.0 s</output></span><input id="timeline" type="range" min="0" max="0" step="any" value="0" aria-label="Shared timeline for eight missions" /></label>
                <div class="speed-control" aria-label="Playback speed"><button type="button" data-speed="0.5" aria-pressed="false">0.5×</button><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2" aria-pressed="false">2×</button></div>
              </div>
              <div class="event-strip"><span>Events</span><div id="event-axis" class="event-axis"></div></div>
            </section>
            <aside class="inspector-card" aria-label="Selected run inspector">
              <header class="inspector-header"><h2>Flight inspector</h2><span id="run-status" class="run-status">—</span></header>
              <div class="inspector-tabs" role="tablist" aria-label="Inspector view" data-tab-group>
                <button role="tab" id="overview-tab" data-panel="overview-panel" aria-controls="overview-panel" aria-selected="true">Overview</button>
                <button role="tab" id="compare-tab" data-panel="compare-panel" aria-controls="compare-panel" aria-selected="false">Compare</button>
                <button role="tab" id="profile-tab" data-panel="profile-panel" aria-controls="profile-panel" aria-selected="false">Profile</button>
                <button role="tab" id="layers-tab" data-panel="layers-panel" aria-controls="layers-panel" aria-selected="false">Layers</button>
              </div>
              <section id="overview-panel" class="inspector-panel" role="tabpanel" aria-labelledby="overview-tab">
                <div><dl class="metric-grid">
                  <div class="metric-card"><dt>Arrival</dt><dd id="metric-arrival">—</dd></div>
                  <div class="metric-card"><dt>Path length</dt><dd id="metric-path">—</dd></div>
                  <div class="metric-card"><dt>Waiting</dt><dd id="metric-wait">—</dd></div>
                  <div class="metric-card"><dt>Outcome</dt><dd id="metric-outcome">—</dd></div>
                </dl></div>
                <section><h4>Live state</h4><p id="current-event" class="current-event">Ready</p><dl id="current-meta" class="evidence-list"></dl></section>
                <section class="witness-section"><div class="witness-heading"><h4>Dynamic separation</h4><span id="witness-quality" class="witness-quality">—</span></div><p id="metric-safety" class="safety-result"></p><p id="witness-summary" class="muted"></p><button id="jump-to-witness" type="button" class="jump-to-witness" disabled>Closest approach</button></section>
              </section>
              <section id="compare-panel" class="inspector-panel" role="tabpanel" aria-labelledby="compare-tab" hidden>
                <div id="planner-comparison" class="planner-comparison"></div>
              </section>
              <section id="profile-panel" class="inspector-panel" role="tabpanel" aria-labelledby="profile-tab" hidden>
                <figure class="profile-chart"><figcaption>Altitude <span>m</span></figcaption><div id="altitude-chart" class="trajectory-chart"></div></figure>
                <figure class="profile-chart"><figcaption>Turn angle <span>°</span></figcaption><div id="turn-chart" class="trajectory-chart"></div></figure>
                <p id="frame-summary" class="muted"></p>
              </section>
              <section id="layers-panel" class="inspector-panel" role="tabpanel" aria-labelledby="layers-tab" hidden>
                <fieldset class="layer-controls"><legend>Map layers</legend>
                  <label><input type="checkbox" data-layer="buildings" checked />Buildings</label>
                  <label><input type="checkbox" data-layer="zones" checked />Restricted volumes</label>
                  <label><input type="checkbox" data-layer="dynamic" checked />Moving traffic</label>
                </fieldset>
                <section class="environment-section"><h4>Environment</h4><dl id="scenario-meta" class="evidence-list"></dl></section>
              </section>
            </aside>
          </div>
        </section>
      </div>
      <p id="load-state" class="load-state" role="status" aria-live="polite">Loading cases…</p>
      <p id="live-region" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/predictive.ts"></script>
  </body>
</html>
