<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recorded UAV missions through the official Manhattan building map." />
    <title>Manhattan Results — UAV 3D Planner</title>
  </head>
  <body>
    <main class="workspace workspace-results" id="mission-results">
      <header class="app-header">
        <a class="brand" href="./" aria-label="Planner home"><span class="brand-mark" aria-hidden="true"></span></a>
        <nav class="study-nav" aria-label="Planning views"><a href="./">Static</a><a href="./dynamic.html">Dynamic</a><a href="./predictive.html">Predictive</a><a href="./results.html" aria-current="page">Results</a></nav>
        <span class="header-meta"><span class="status-dot" aria-hidden="true"></span>NYC map · Simulated missions</span>
      </header>
      <div class="workspace-body">
        <section class="workspace-content" aria-label="Manhattan mission results">
          <p id="load-state" class="load-state" role="status" aria-live="polite">Loading Manhattan mission records…</p>
          <div class="demo-grid results-layout">
            <section class="stage-card results-stage" aria-label="All study results"><section class="results-panel" aria-label="Overall algorithm comparisons"><div id="comparison-charts" class="results-overview"></div><p class="results-note" id="results-note"></p></section></section>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/results.ts"></script>
  </body>
</html>
