[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-3d-planner-lab"
dynamic = ["version"]
description = "A reproducible benchmark for static 3D UAV planning and dynamic replanning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Revincxt" }]
keywords = [
  "uav",
  "path-planning",
  "replanning",
  "a-star",
  "d-star-lite",
  "theta-star",
  "rrt-star",
  "robotics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
uav3d = "uav3d.cli:main"

[project.urls]
Homepage = "https://github.com/Revincxt/uav-3d-planner-lab"
Repository = "https://github.com/Revincxt/uav-3d-planner-lab"
Issues = "https://github.com/Revincxt/uav-3d-planner-lab/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uav3d = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "uav3d.version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["uav3d"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["uav3d"]
