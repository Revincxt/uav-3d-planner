name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_python_matrix:
        description: Run all supported Python versions and the independent dataset audit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Select checks for main-branch pushes
        id: filter
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            let python = true, web = true;
            const before = context.payload.before;
            // PRs, releases, manual runs and uncertain diffs check all components.
            if (context.eventName === 'push' && context.ref === 'refs/heads/main' && before && !/^0+$/.test(before)) {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: `${before}...${context.sha}`, per_page: 1,
                });
                // GitHub returns at most 300 changed files, including renames.
                if (data.status === 'ahead' && data.files && data.files.length < 300) {
                  const paths = data.files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                  python = paths.some(path => /^(src|tests|scenarios|scripts|data|\.github)\//.test(path)
                    || /\.py$|^pyproject\.toml$|^Makefile$/.test(path)
                    || /^web\/(scripts|shared)\/|^web\/public\/.*\.(json|csv)$/.test(path));
                  web = paths.some(path => /^(web|data|src|scenarios|scripts|\.github)\/|^pyproject\.toml$/.test(path));
                }
              } catch (error) {
                core.warning(`Changed files unavailable; checking all components: ${error.message}`);
              }
            }
            core.setOutput('python', String(python));
            core.setOutput('web', String(web));

  python-tests:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Daily regression uses one baseline; releases/manual checks cover compatibility.
        python-version: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.full_python_matrix == true) && '["3.11","3.12","3.13","3.14"]' || '["3.12"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Set up Node.js for study archives
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
      - name: Restore verified study data
        run: node web/scripts/study-data.mjs
      - name: Verify curated scenarios
        run: python scripts/export_scenarios.py --check
      - name: Re-audit committed web study data
        if: matrix.python-version == '3.12' && (startsWith(github.ref, 'refs/tags/v') || inputs.full_python_matrix == true)
        run: python scripts/validate_committed_data.py
      - name: Run tests with branch coverage
        if: matrix.python-version == '3.12'
        run: pytest --cov=uav3d --cov-report=term-missing
      - name: Run compatibility tests
        if: matrix.python-version != '3.12'
        run: pytest

  python-quality:
    name: Python quality
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type-check
        run: mypy src

  package:
    name: Wheel and CLI smoke test
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed CLI
        run: |
          uav3d --version
          uav3d scene list
          uav3d dynamic list
          uav3d predictive list
          uav3d plan --scene vertical-gate --algorithm astar-3d --output /tmp/result.json
          uav3d dynamic simulate --scenario pop-up-nfz --algorithm dstar-lite-3d --output /tmp/dynamic.json
          uav3d predictive plan --scenario wait-then-straight --algorithm space-time-astar-4d --output /tmp/predictive.json
          uav3d sweep resolution --scenes vertical-gate --resolutions 4,6 --output /tmp/sweep.json

  web:
    name: Static, dynamic, and predictive Web studies
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.2.0
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm typecheck
      - name: Test web studies
        run: pnpm test
      # Pages builds main; PRs, tags and manual runs still verify a full build here.
      - name: Validate and build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pnpm build
