name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Verify curated scenarios
        run: python scripts/export_scenarios.py --check
      - name: Re-audit committed web study data
        run: python scripts/validate_committed_data.py
      - name: Run tests with branch coverage
        run: pytest --cov=uav3d --cov-report=term-missing

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type-check
        run: mypy src

  package:
    name: Wheel and CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed CLI
        run: |
          uav3d --version
          uav3d scene list
          uav3d dynamic list
          uav3d predictive list
          uav3d plan --scene vertical-gate --algorithm astar-3d --output /tmp/result.json
          uav3d dynamic simulate --scenario pop-up-nfz --algorithm dstar-lite-3d --output /tmp/dynamic.json
          uav3d predictive plan --scenario wait-then-straight --algorithm space-time-astar-4d --output /tmp/predictive.json
          uav3d sweep resolution --scenes vertical-gate --resolutions 4,6 --output /tmp/sweep.json

  web:
    name: Static, dynamic, and predictive Web studies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.2.0
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate, test, and build
        run: |
          pnpm validate:data
          pnpm test
          pnpm typecheck
          pnpm build
