<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">UAV 3D Planner Lab study design</title>
  <desc id="desc">A three-panel academic schematic showing structured urban airspace, static and dynamic planning conditions, and the shared collision audit used to export recorded evidence.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a1f"/>
      <stop offset="1" stop-color="#0f1519"/>
    </linearGradient>
    <linearGradient id="buildingFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#879195"/>
      <stop offset="1" stop-color="#606b70"/>
    </linearGradient>
    <linearGradient id="certified" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb9e8"/>
      <stop offset="1" stop-color="#8dd7bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#728087"/>
    </marker>
    <style>
      .eyebrow { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; fill: #98a4a8; }
      .title { font: 600 38px Georgia, 'Times New Roman', serif; fill: #eef1ef; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aeb8bb; }
      .panel-title { font: 600 20px Georgia, 'Times New Roman', serif; fill: #edf0ee; }
      .panel-copy { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aeb8bb; }
      .label { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.4px; fill: #8f9a9e; }
      .card-title { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e8ecea; }
      .card-copy { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aab5b8; }
      .metric { font: 600 28px Georgia, 'Times New Roman', serif; fill: #f3f5f3; }
      .metric-label { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .8px; fill: #97a3a7; }
    </style>
  </defs>

  <rect width="1600" height="760" rx="24" fill="url(#page)"/>
  <path d="M50 126 H1550" stroke="#334046"/>
  <text x="56" y="55" class="eyebrow">REPRODUCIBLE PLANNING STUDY</text>
  <text x="56" y="101" class="title">From structured city geometry to collision-certified evidence</text>
  <text x="1548" y="55" text-anchor="end" class="subtitle">static 3D · reactive replanning · predictive 4D</text>

  <!-- Panel 1: city geometry -->
  <g filter="url(#shadow)">
    <rect x="50" y="156" width="470" height="532" rx="12" fill="#1b2328" stroke="#344148"/>
  </g>
  <text x="78" y="196" class="label">01 · ENVIRONMENT</text>
  <text x="78" y="229" class="panel-title">Structured urban airspace</text>
  <text x="78" y="254" class="panel-copy">Unequal-height buildings, static NFZs, and timed hazards.</text>

  <g opacity=".45" stroke="#39464d" stroke-width="1">
    <path d="M78 615 L286 485 L490 600"/>
    <path d="M78 570 L286 440 L490 555"/>
    <path d="M78 525 L286 395 L490 510"/>
    <path d="M118 638 L326 508"/>
    <path d="M172 668 L380 538"/>
    <path d="M230 680 L438 550"/>
  </g>

  <!-- isometric buildings -->
  <g>
    <path d="M99 492 l48 -28 32 18 -48 28z" fill="#a4adaf"/>
    <path d="M99 492 v108 l32 18 V510z" fill="#6c777b"/>
    <path d="M131 510 l48 -28 v108 l-48 28z" fill="url(#buildingFront)"/>

    <path d="M181 421 l62 -36 37 21 -62 36z" fill="#b0b7b8"/>
    <path d="M181 421 v166 l37 21 V442z" fill="#737e82"/>
    <path d="M218 442 l62 -36 v166 l-62 36z" fill="url(#buildingFront)"/>

    <path d="M304 478 l54 -31 34 20 -54 31z" fill="#a9b1b3"/>
    <path d="M304 478 v106 l34 19 V498z" fill="#6f7a7e"/>
    <path d="M338 498 l54 -31 v106 l-54 30z" fill="url(#buildingFront)"/>

    <path d="M388 376 l55 -32 34 20 -55 32z" fill="#b3babb"/>
    <path d="M388 376 v166 l34 20 V396z" fill="#758084"/>
    <path d="M422 396 l55 -32 v166 l-55 32z" fill="url(#buildingFront)"/>

    <path d="M271 358 l47 -27 31 18 -47 27z" fill="#9fa8aa"/>
    <path d="M271 358 v80 l31 18 V376z" fill="#687378"/>
    <path d="M302 376 l47 -27 v80 l-47 27z" fill="#7c878a"/>
  </g>

  <!-- NFZ and hazards -->
  <g>
    <ellipse cx="352" cy="381" rx="29" ry="12" fill="#c88264" fill-opacity=".18" stroke="#c88264" stroke-opacity=".62"/>
    <path d="M323 381 V520 M381 381 V520" stroke="#c88264" stroke-opacity=".5"/>
    <ellipse cx="352" cy="520" rx="29" ry="12" fill="#c88264" fill-opacity=".09" stroke="#c88264" stroke-opacity=".4"/>
    <circle cx="149" cy="440" r="17" fill="#aa8ec0" fill-opacity=".9"/>
    <circle cx="443" cy="472" r="17" fill="#aa8ec0" fill-opacity=".9"/>
    <path d="M149 440 C214 420 276 464 332 450 S409 437 443 472" fill="none" stroke="#9e86b1" stroke-width="2" stroke-dasharray="6 7" opacity=".65"/>
  </g>
  <path d="M92 548 C146 528 174 553 223 526 C267 502 297 531 329 500 C365 464 405 503 474 440" fill="none" stroke="url(#certified)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="92" cy="548" r="6" fill="#7fb9e8"/>
  <circle cx="474" cy="440" r="6" fill="#8dd7bf"/>

  <g transform="translate(79 646)">
    <rect width="414" height="24" rx="5" fill="#141b1f" stroke="#303d43"/>
    <circle cx="16" cy="12" r="5" fill="#8dd7bf"/>
    <text x="29" y="17" class="card-copy">certified path</text>
    <rect x="126" y="7" width="10" height="10" fill="#7e898d"/>
    <text x="145" y="17" class="card-copy">building</text>
    <circle cx="240" cy="12" r="5" fill="#aa8ec0"/>
    <text x="253" y="17" class="card-copy">moving hazard</text>
    <circle cx="372" cy="12" r="6" fill="#c88264" fill-opacity=".5" stroke="#c88264"/>
    <text x="385" y="17" class="card-copy">NFZ</text>
  </g>

  <!-- connector -->
  <path d="M530 422 H552" stroke="#728087" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 2: planning conditions -->
  <g filter="url(#shadow)">
    <rect x="565" y="156" width="470" height="532" rx="12" fill="#1b2328" stroke="#344148"/>
  </g>
  <text x="593" y="196" class="label">02 · PROTOCOLS</text>
  <text x="593" y="229" class="panel-title">Three study tracks</text>
  <text x="593" y="254" class="panel-copy">Planner families are compared only within declared contracts.</text>

  <g>
    <rect x="593" y="289" width="414" height="94" rx="9" fill="#202a30" stroke="#3b4850"/>
    <rect x="593" y="289" width="7" height="94" rx="3.5" fill="#86aedd"/>
    <text x="618" y="317" class="label">STATIC · 3D</text>
    <text x="618" y="345" class="card-title">A* · Lazy Theta* · RRT*</text>
    <text x="618" y="368" class="card-copy">Same geometry; grid, any-angle, and sampling-based search.</text>

    <rect x="593" y="402" width="414" height="94" rx="9" fill="#202a30" stroke="#3b4850"/>
    <rect x="593" y="402" width="7" height="94" rx="3.5" fill="#b198c4"/>
    <text x="618" y="430" class="label">REACTIVE · 3D + TIME</text>
    <text x="618" y="458" class="card-title">Repeated A* · Lazy Theta* · D* Lite</text>
    <text x="618" y="481" class="card-copy">Snapshot geometry with deterministic execution and replanning.</text>

    <rect x="593" y="515" width="414" height="108" rx="9" fill="#202a30" stroke="#4b6a64"/>
    <rect x="593" y="515" width="7" height="108" rx="3.5" fill="#8dd7bf"/>
    <text x="618" y="543" class="label">PREDICTIVE · 4D SPACE–TIME</text>
    <text x="618" y="571" class="card-title">A* · D* Lite reset/reuse · Space-Time A*</text>
    <text x="618" y="594" class="card-copy">Reactive snapshots versus a complete deterministic schedule.</text>
    <text x="618" y="614" class="card-copy">Explicit waits on a 4 m × 0.5 s finite lattice.</text>
  </g>
  <path d="M800 383 V397" stroke="#59676e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M800 496 V510" stroke="#59676e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- connector -->
  <path d="M1045 422 H1067" stroke="#728087" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 3: audit and evidence -->
  <g filter="url(#shadow)">
    <rect x="1080" y="156" width="470" height="532" rx="12" fill="#1b2328" stroke="#344148"/>
  </g>
  <text x="1108" y="196" class="label">03 · EVIDENCE</text>
  <text x="1108" y="229" class="panel-title">Shared post-processing and audit</text>
  <text x="1108" y="254" class="panel-copy">Raw planner output remains available beside the certified path.</text>

  <g transform="translate(1108 286)">
    <text x="0" y="13" class="label">RAW</text>
    <path d="M62 7 L132 34 L196 -4 L263 29 L327 1 L409 23" fill="none" stroke="#768389" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="0" y="79" class="label">CERTIFIED</text>
    <path d="M62 73 C98 73 105 97 136 96 C169 95 175 54 207 54 C241 54 245 88 277 88 C312 88 326 63 354 63 C379 63 391 78 409 78" fill="none" stroke="url(#certified)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(1108 407)">
    <rect width="414" height="78" rx="9" fill="#202a30" stroke="#3b4850"/>
    <circle cx="23" cy="24" r="6" fill="#8dd7bf"/>
    <text x="41" y="29" class="card-title">Continuous geometry + space–time audit</text>
    <text x="41" y="53" class="card-copy">Endpoints, restrictions, moving hazards, and dense segments.</text>
  </g>

  <text x="1108" y="518" class="label">V0.5 FIXED BUNDLE</text>
  <g transform="translate(1108 538)">
    <rect width="96" height="84" rx="8" fill="#202a30" stroke="#3b4850"/>
    <text x="48" y="38" text-anchor="middle" class="metric">8</text>
    <text x="48" y="61" text-anchor="middle" class="metric-label">MISSIONS</text>

    <rect x="106" width="96" height="84" rx="8" fill="#202a30" stroke="#3b4850"/>
    <text x="154" y="38" text-anchor="middle" class="metric">32</text>
    <text x="154" y="61" text-anchor="middle" class="metric-label">RUNS</text>

    <rect x="212" width="96" height="84" rx="8" fill="#202a30" stroke="#3b4850"/>
    <text x="260" y="38" text-anchor="middle" class="metric">0</text>
    <text x="260" y="61" text-anchor="middle" class="metric-label">VIOLATIONS</text>

    <rect x="318" width="96" height="84" rx="8" fill="#202a30" stroke="#4b6a64"/>
    <text x="366" y="38" text-anchor="middle" class="metric">26</text>
    <text x="366" y="61" text-anchor="middle" class="metric-label">ROUNDED</text>
  </g>
  <text x="1315" y="656" text-anchor="middle" class="card-copy">Recorded deterministic evidence · non-confirmatory</text>

  <text x="800" y="727" text-anchor="middle" class="subtitle">The browser replays committed records; planning, smoothing, and independent validation run in Python.</text>
</svg>
